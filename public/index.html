<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winning</title>
<meta name="theme-color" content="#1E2B25">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1EA; --surface:#E3E9DF; --raised:#F6F8F4; --ink:#1E2B25; --ink-2:#56655C; --line:#CAD3C5;
  --marigold:#E9A23B; --marigold-ink:#8A5A10;
  --c-work:#2F6F6A; --c-job:#5D6B87; --c-fitness:#E9A23B; --c-creative:#7A4E7E; --c-food:#8DA06B; --c-health:#93A39A; --c-people:#3E86A8;
  --late:#B4533A;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#131A16; --surface:#1B241F; --raised:#212C26; --ink:#E7EDE6; --ink-2:#A3B1A8; --line:#2E3B34; --marigold-ink:#F2BE6E; --c-health:#6F8178; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:calc(14px + var(--safe-t)) 18px calc(96px + var(--safe-b))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.muted{color:var(--ink-2)}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.day-title{flex:1;min-width:0}
.day-title h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.day-title p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.today-btn{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + var(--safe-b));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;min-width:0;max-width:140px;border:0;background:none;padding:8px 6px;border-radius:12px;font-weight:700;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface)}

/* today layout */
.today{display:grid;gap:18px}
@media (min-width:900px){
  .today{grid-template-columns:380px 1fr;align-items:start}
  .today .side{position:sticky;top:18px}
  nav.tabs{top:0;bottom:auto;justify-content:flex-end;border:0;background:none;backdrop-filter:none;padding:16px 24px;pointer-events:none}
  nav.tabs button{pointer-events:auto;flex:none;flex-direction:row;padding:9px 14px;gap:7px}
  .wrap{padding-top:22px;padding-bottom:40px}
  .top{padding-right:420px}
}
.dial{position:relative;aspect-ratio:1;max-width:340px;margin:0 auto}
.dial svg{width:100%;height:100%;display:block}
.dial .center{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .state{font-size:14px;color:var(--ink-2);font-weight:700}
.dial .now-t{font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,26px);line-height:1.08;margin:4px 0;text-wrap:balance}
.dial .left{font-size:14px;color:var(--ink-2)}
.dial .pct{font-family:var(--display);font-weight:800;font-size:52px;line-height:1}
.next{margin-top:10px;text-align:center;font-size:15px;color:var(--ink-2)}
.next b{color:var(--ink)}

.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.counter{background:var(--surface);border-radius:var(--r-md);padding:10px 10px 8px}
.counter .lab{font-size:14px;font-weight:700;line-height:1.2;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter .per{font-size:13px;color:var(--ink-2);margin-top:2px}
.counter .val{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.counter .val small{font-size:15px;color:var(--ink-2);font-weight:500}
.counter .ctl{display:flex;gap:6px;margin-top:8px}
.counter .ctl button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-weight:700;font-size:18px;line-height:1}
.counter .ctl button.plus{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* block list */
.list{list-style:none;margin:0;padding:0}
.blk{display:grid;grid-template-columns:52px 4px 1fr 46px;gap:0 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk .time{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.blk .time span{display:block;font-weight:500;font-size:13px;color:var(--ink-2)}
.blk .bar{align-self:stretch;border-radius:4px;background:var(--cat)}
.blk .what b{display:block;font-weight:700;line-height:1.25}
.blk .what span{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.blk.now{background:var(--surface);border-radius:var(--r-md);border-bottom-color:transparent;padding:14px 12px;margin:4px -12px}
.blk.now .what b::after{content:"Now";margin-left:8px;font-size:12px;font-weight:700;color:var(--marigold-ink);background:color-mix(in srgb,var(--marigold) 22%,transparent);padding:2px 7px;border-radius:999px;vertical-align:2px}
.blk.done .what b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ink-2);color:var(--ink-2)}
.tick{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;transition:transform .15s ease}
.tick svg{width:22px;height:22px;opacity:0}
.blk.done .tick{background:var(--cat);border-color:var(--cat);color:#fff}
.blk.done .tick svg{opacity:1}
.tick:active{transform:scale(.9)}
.blk .what{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;width:100%;cursor:pointer}
.blk .what .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.blk .what .tag{display:inline-block;font-size:13px;margin-top:0;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.blk .what .tag.note{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.blk .more{grid-column:1/-1;margin-top:12px;background:var(--surface);border-radius:var(--r-md);padding:14px}
.blk.now .more{background:var(--raised)}
.blk .more .row{margin-bottom:12px}
.blk .more input[type=time]{width:auto;min-width:130px}
.blk .more .chips{margin-bottom:8px}
.pl{background:var(--surface);border-radius:var(--r-md);padding:14px 14px 14px 18px;margin-bottom:12px;border-left:6px solid var(--cat)}
.pl .row{margin-bottom:10px}
.pl input[type=time]{width:auto;min-width:118px}
.pl select.t{width:auto;max-width:100%;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 12px;font-size:16px}
.pl .chips .chip{padding:6px 10px;min-width:40px}
.pl .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip.danger{color:var(--late);border-color:var(--late)}
.poops{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tp{display:inline-flex;align-items:center;gap:4px}
.tp select.t{width:auto;min-width:0;padding:6px 8px;font-size:15px}
.tp b{font-weight:700}
.mini{background:var(--surface);border-radius:var(--r-md);padding:14px;margin-top:12px}
.mini h3{font-size:15px;font-weight:700;margin:0 0 6px;color:var(--ink-2)}
.mini .bigv{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.mini .bigv small{font-size:15px;color:var(--ink-2);font-weight:500}
.mini .sub{font-size:14px;color:var(--ink-2);margin-top:4px}
.mini .good{color:var(--c-work);font-weight:700}.mini .bad{color:var(--late);font-weight:700}
.mini form{display:flex;gap:8px;margin-top:6px}.mini form input{flex:1;min-width:0}
.mini .row{gap:8px;margin-top:10px}
.fastbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}.fastbar i{display:block;height:100%;background:var(--c-food)}
.blk .what{touch-action:pan-y}
nav.tabs button span{font-size:12.5px;white-space:nowrap}
.heat{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;font-size:12px;color:var(--ink-2);align-items:center}
.heat .c{aspect-ratio:1;border-radius:5px;border:0;padding:0;background:var(--line);cursor:pointer;position:relative}
.heat .c.fut{background:transparent;border:1px dashed var(--line);cursor:default}
.heat .c.sel{outline:2px solid var(--ink);outline-offset:1px}
.heat .c span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:var(--ink-2)}
.streaks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:900px){.streaks{grid-template-columns:repeat(4,1fr)}}
.streaks div{background:var(--surface);border-radius:var(--r-md);padding:12px}
.streaks b{display:block;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.streaks span{font-size:13px;color:var(--ink-2)}
.dots{display:flex;gap:3px;margin-top:6px}.dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--c-work)}
.daybars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin:6px 0}
.daybars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--ink-2)}
.daybars i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--c-work);min-height:3px}
.daybars div.best i{background:var(--marigold)}
.suggest{background:color-mix(in srgb,var(--marigold) 18%,var(--surface));border-radius:var(--r-md);padding:14px;font-weight:600}
.donelist h3{font-size:15px;margin:16px 0 6px;color:var(--ink-2)}
.donelist ul{list-style:none;margin:0;padding:0}.donelist li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.donelist li i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--cat);transform:translateY(1px)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:900px){.gal{grid-template-columns:repeat(4,1fr)}}
.gal .g{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.gal .g img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--line)}
.gal .g .ph{aspect-ratio:4/5;display:grid;place-items:center;background:var(--line);color:var(--ink-2);font-size:40px}
.gal .g .m{padding:10px}.gal .g b{display:block;line-height:1.25}.gal .g small{display:block;color:var(--ink-2);font-size:13px}
.mealrow{display:flex;gap:8px}.mealrow input{flex:1;min-width:0}
.mic{flex:none;width:46px;border-radius:12px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center}
.mic.on{background:var(--late);color:#fff;border-color:var(--late);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.favs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.favs .chip{padding:5px 10px;font-size:13px;font-weight:600}
.blk.swiping .what{transition:none}
.blk .what.swipe-ok{box-shadow:inset 4px 0 0 var(--c-work)}
.switch{display:flex;align-items:center;gap:14px;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.switch .knob{flex:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"] .knob{background:var(--c-work)}
.switch[aria-checked="true"] .knob::after{transform:translateX(22px)}
.switch b{display:block}.switch small{display:block;color:var(--ink-2);font-size:14px}
.icon-btn.bell[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.plrow{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-left:6px solid var(--cat);color:inherit;font:inherit;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.plrow .pt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.plrow .pt small,.plrow .pn small{display:block;font-weight:500;font-size:13px;color:var(--ink-2);margin-top:2px}
.plrow .pn b{display:block;line-height:1.25}
.plrow .pe{font-size:14px;font-weight:700;color:var(--ink-2)}
.blk .time{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;position:relative}
.blk .time::before{content:"";position:absolute;left:-12px;top:4px;bottom:4px;width:6px;background:radial-gradient(circle,var(--ink-2) 1.2px,transparent 1.4px) 0 0/6px 6px;opacity:.45}
.blk.dragging{position:relative;z-index:5;background:var(--raised);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:var(--r-md);transition:none}
.list.is-dragging .blk:not(.dragging){transition:transform .12s ease}
.dropline{height:0;border-top:3px solid var(--marigold);margin:-2px 0;position:relative;list-style:none}
.dropline span{position:absolute;right:0;top:-14px;background:var(--marigold);color:#1b1b1b;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px}
.est{font-size:14px;color:var(--ink-2);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.est b{color:var(--ink);font-family:var(--display)}
.est .chip{padding:4px 10px;font-size:13px}
.fuel{display:grid;gap:10px;margin-bottom:18px}
.fuel .big-k{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.fuel .big-k small{font-size:16px;color:var(--ink-2);font-weight:500}
.mac{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:14px}
.mac .meter{grid-column:auto;height:8px}
.meter.over i{background:var(--late)}
.tgt{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tgt div{background:var(--raised);border-radius:12px;padding:12px}
.tgt b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.tgt span{font-size:13px;color:var(--ink-2)}

/* generic */
.section{margin-top:26px}
.section h2{font-size:22px;font-weight:800;margin-bottom:12px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:18px}
.grid2{display:grid;gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
label.f{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
.field{margin-bottom:14px}
input.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:11px 13px;font-size:17px}
textarea.t{min-height:84px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:8px 13px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.saved{font-size:14px;color:var(--ink-2);min-height:1.4em}

/* goals */
.wk{display:grid;gap:12px}
.wk-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.wk-row .n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.meter{grid-column:1/-1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.meter.full i{background:var(--marigold)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:900px){.big{grid-template-columns:repeat(4,1fr)}}
.big .cell{background:var(--surface);border-radius:var(--r-md);padding:14px}
.big .num{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.big .num small{font-size:18px;color:var(--ink-2);font-weight:500}
.big .lab{color:var(--ink-2);font-size:14px;margin:4px 0 10px}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.dl .when{font-family:var(--display);font-weight:700;font-size:15px;min-width:58px}
.dl .left{font-size:14px;color:var(--ink-2);text-align:right}
.dl .left.soon{color:var(--marigold-ink);font-weight:700}
.dl .left.late{color:var(--late);font-weight:700}
.dl li.done .t{text-decoration:line-through;color:var(--ink-2)}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
li.done .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
li.done .box svg{opacity:1}

/* body */
table.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.hist th{text-align:left;font-size:13px;color:var(--ink-2);font-weight:700;padding:6px 6px 6px 0}
table.hist td{padding:9px 6px 9px 0;border-top:1px solid var(--line)}
.chart svg{width:100%;height:auto;display:block}
.stat-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
.stat-row div b{display:block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.stat-row div span{font-size:14px;color:var(--ink-2)}

/* unlock */
.unlock{min-height:80vh;display:grid;place-items:center}
.unlock .card{max-width:380px;width:100%}
.unlock h1{font-size:40px;font-weight:800;margin-bottom:6px}
.err{color:var(--late);font-weight:700;font-size:15px;min-height:1.4em;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;z-index:9;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.offline{font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { blocksFor, dayBlocks, dowOf, BLOCKS, TARGETS, DEADLINES, BIG, ymd, parseYmd, mins, weekDates, isShortWeek, PLAN_START, PLAN_END } from "./schedule.js";

const MODE = "netlify"; // replaced with "artifact" for the Claude page build
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const BELL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>';
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

// ---------- state ----------
const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } };
const today = () => ymd(new Date());
const S = {
  key: MODE === "artifact" ? "owner" : LS("plan.key"),
  view: (location.hash || "#today").slice(1),
  date: today(),
  days: {}, body: { height: null, entries: [] }, goals: { milestones: {}, shirts: 0, demos: 0, client: 0 },
  online: true,
};
const cached = LS("plan.cache");
if (cached) Object.assign(S, { days: cached.days || {}, body: cached.body || S.body, goals: cached.goals || S.goals });
if (!["today", "gallery", "plan", "log", "body", "goals", "progress"].includes(S.view)) S.view = "today";

const day = (d = S.date) => (S.days[d] ||= { done: {}, counts: {}, meals: {} });
const REASONS = ["No time", "Too tired", "Did it later", "Moved to tomorrow", "Felt low", "Plans changed"];
const fromMin = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const nowHM = () => fromMin(nowMin());
const cache = () => LS("plan.cache", { days: S.days, body: S.body, goals: S.goals });

async function api(path, opts = {}) {
  const res = await fetch("/api/" + path, { ...opts, headers: { "content-type": "application/json", "x-key": S.key || "", ...(opts.headers || {}) } });
  if (res.status === 401) throw Object.assign(new Error("key"), { code: 401 });
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}

const timers = {};
function save(what, arg) {
  cache();
  const id = what + (arg || "");
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try {
      if (MODE === "artifact") { const db = await getDb(); await db.doc(what === "day" ? "days/" + arg : "meta/" + what).set(JSON.parse(JSON.stringify(what === "day" ? S.days[arg] : S[what]))); }
      else if (what === "day") await api("day/" + arg, { method: "PUT", body: JSON.stringify(S.days[arg]) });
      else await api(what, { method: "PUT", body: JSON.stringify(S[what]) });
      setOnline(true);
      const el = $("#saved"); if (el) el.textContent = "Saved";
    } catch (e) { setOnline(false); }
  }, 500);
}
function setOnline(v) { if (S.online !== v) { S.online = v; const o = $("#offline"); if (o) o.hidden = v; } }

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

// ---------- helpers ----------
const fmtDay = (d) => parseYmd(d).toLocaleDateString("en-GB", { weekday: "long" });
const fmtDate = (d) => parseYmd(d).toLocaleDateString("en-GB", { day: "numeric", month: "long" });
const fmtShort = (d) => parseYmd(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const addDays = (d, n) => { const x = parseYmd(d); x.setDate(x.getDate() + n); return ymd(x); };
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const planDay = (d) => daysBetween(PLAN_START, d) + 1;

function weekStats(d) {
  const dates = weekDates(d);
  const out = {};
  for (const t of TARGETS) out[t.key] = 0;
  for (const dt of dates) {
    const rec = S.days[dt]; if (!rec) continue;
    for (const b of blocksFor(dt, sched())) if (b.counts && rec.done?.[b.id] && out[b.counts] !== undefined) out[b.counts]++;
    out.apps += rec.counts?.apps || 0;
    out.outreach += rec.counts?.outreach || 0;
  }
  return out;
}
const totalApps = () => Object.values(S.days).reduce((a, r) => a + (r.counts?.apps || 0), 0);

// ---------- dial ----------
const DAY0 = 7 * 60, SPAN = 16 * 60; // 07:00 to 23:00
function arcPath(cx, cy, r, a0, a1) {
  const p = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
const ang = (m) => ((Math.min(Math.max(m, DAY0), DAY0 + SPAN) - DAY0) / SPAN) * Math.PI * 2;

function dial(blocks, rec, isToday) {
  const cx = 160, cy = 160, r = 128;
  let arcs = "";
  for (const b of blocks) {
    if (b.id === "weigh") continue;
    const at = rec.at?.[b.id], st = at ? mins(at) : mins(b.s), en = st + (mins(b.e) - mins(b.s));
    const a0 = ang(st) + 0.012, a1 = Math.max(ang(en) - 0.012, a0 + 0.02);
    const done = rec.done?.[b.id];
    arcs += `<path d="${arcPath(cx, cy, r, a0, a1)}" stroke="var(--c-${b.cat})" stroke-width="${done ? 26 : 20}" fill="none" opacity="${done ? 1 : 0.32}" stroke-linecap="butt"/>`;
  }
  let ticks = "";
  for (let h = 7; h <= 22; h++) {
    const a = ang(h * 60), r1 = r - 24, r2 = h % 3 === 0 ? r - 34 : r - 29;
    ticks += `<line x1="${cx + r1 * Math.sin(a)}" y1="${cy - r1 * Math.cos(a)}" x2="${cx + r2 * Math.sin(a)}" y2="${cy - r2 * Math.cos(a)}" stroke="var(--ink-2)" stroke-width="${h % 3 === 0 ? 2 : 1}" opacity=".6"/>`;
    if (h % 3 === 0) { const rt = r - 48; ticks += `<text x="${cx + rt * Math.sin(a)}" y="${cy - rt * Math.cos(a) + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink-2)" font-family="Atkinson Hyperlegible">${h}</text>`; }
  }
  let hand = "";
  if (isToday) {
    const m = nowMin();
    if (m >= DAY0 && m <= DAY0 + SPAN) {
      const a = ang(m);
      hand = `<line x1="${cx + (r - 40) * Math.sin(a)}" y1="${cy - (r - 40) * Math.cos(a)}" x2="${cx + (r + 18) * Math.sin(a)}" y2="${cy - (r + 18) * Math.cos(a)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="${cx + (r + 18) * Math.sin(a)}" cy="${cy - (r + 18) * Math.cos(a)}" r="6" fill="var(--marigold)" stroke="var(--paper)" stroke-width="2.5"/>`;
    }
  }
  return `<svg viewBox="0 0 320 320" role="img" aria-label="Your day from 7am to 11pm"><circle cx="${cx}" cy="${cy}" r="${r}" stroke="var(--line)" stroke-width="20" fill="none" opacity=".55"/>${arcs}${ticks}${hand}</svg>`;
}

// ---------- views ----------
function header(title, sub, nav = true) {
  const isT = S.date === today();
  return `<header class="top">
    <div class="day-title"><h1>${esc(title)}</h1><p>${sub}</p></div>
    ${nav && !isT ? `<button class="today-btn" data-act="goToday">Today</button>` : ""}
    ${pushSupported() && Notification.permission !== "denied" ? `<button class="icon-btn bell" data-act="togglePush" aria-pressed="${!!S.pushOn}" aria-label="Alerts on this device: ${S.pushOn ? "on" : "off"}" title="Alerts on this device: ${S.pushOn ? "on" : "off"}">${BELL}</button>` : ""}
    ${nav ? `<button class="icon-btn" data-act="prev" aria-label="Previous day">${CHEV_L}</button><button class="icon-btn" data-act="next" aria-label="Next day">${CHEV_R}</button>` : ""}
  </header>`;
}

function viewToday() {
  const d = S.date, rec = day(d), blocks = dayBlocks(d, rec, S.goals), isT = d === today();
  const m = nowMin();
  const tickable = blocks;
  const doneN = tickable.filter((b) => rec.done?.[b.id]).length;
  const pct = tickable.length ? Math.round((doneN / tickable.length) * 100) : 0;
  let center, nextLine = "";
  const cur = isT ? blocks.filter((b) => b.id !== "weigh" && mins(b.s) <= m && m < mins(b.e)).pop() : null;
  const nxt = isT ? blocks.find((b) => mins(b.s) > m) : null;
  if (cur) {
    const left = mins(cur.e) - m;
    center = `<div class="state">Now, until ${cur.e}</div><div class="now-t">${esc(cur.t)}</div><div class="left">${left} min left</div>`;
  } else {
    center = `<div class="pct">${pct}%</div><div class="left">${doneN} of ${tickable.length} done</div>`;
  }
  if (nxt) nextLine = `<p class="next">Next at <b>${nxt.s}</b>: ${esc(nxt.t)}</p>`;
  else if (isT && m >= DAY0) nextLine = `<p class="next">That's the day. ${doneN} of ${tickable.length} done.</p>`;

  const wk = weekStats(d);
  const sub = `${fmtDate(d)}, day ${planDay(d)} of 53${isShortWeek(d) ? ", short sessions this week" : ""}`;
  const items = blocks.map((b) => {
    const isNow = cur && cur.id === b.id, done = rec.done?.[b.id];
    const subl = [b.sub, b.short && isShortWeek(d) ? "About two thirds length this week" : ""].filter(Boolean).join(". ");
    const at = rec.at?.[b.id], note = rec.notes?.[b.id], open = S.open === b.id;
    const tags = [b.planned ? `<span class="tag">${b.movedScope === "all" ? "Moved from " + b.planned + ", every time" : "Today only, usually " + b.base}</span>` : "", at ? `<span class="tag">Done at ${at}</span>` : "", note ? `<span class="tag note">${esc(note)}</span>` : ""].join("");
    const more = open ? `<div class="more">
        <div class="field"><span class="f">Changes apply to</span><div class="chips">
          <button class="chip" data-act="scope" data-v="day" aria-pressed="${S.scope === "day"}">Just today</button>
          <button class="chip" data-act="scope" data-v="all" aria-pressed="${S.scope === "all"}">Every time</button></div></div>
        <div class="field"><label class="f" for="nm-${b.id}">Name</label>
          <input class="t" id="nm-${b.id}" data-name="${b.id}" value="${esc(b.t)}" autocomplete="off" enterkeyhint="done">
          <div class="est">${b.nameScope === "day" ? `<button class="chip" data-act="unname" data-v="day" data-id="${b.id}">Today only. Back to "${esc(b.baseName)}"</button>` : ""}${b.orig && b.baseName !== b.orig ? `<button class="chip" data-act="unname" data-v="all" data-id="${b.id}">Back to original "${esc(b.orig)}"</button>` : ""}</div></div>
        <div class="row"><label class="f" for="mv-${b.id}" style="margin:0">Starts at</label>
          <input class="t" type="time" id="mv-${b.id}" data-move="${b.id}" value="${b.s}">
          ${b.movedScope === "day" ? `<button class="chip" data-act="unmove" data-v="day" data-id="${b.id}">Back to ${b.base}</button>` : ""}${b.base !== (b.planned || b.s) ? `<button class="chip" data-act="unmove" data-v="all" data-id="${b.id}">Back to original ${b.planned || b.s}</button>` : ""}</div>
        <div class="row"><label class="f" for="at-${b.id}" style="margin:0">Done at</label>
          <input class="t" type="time" id="at-${b.id}" data-at="${b.id}" value="${at || ""}">
          <button class="chip" data-act="atNow" data-id="${b.id}">Now</button>
          ${at ? `<button class="chip" data-act="atClear" data-id="${b.id}">Clear time</button>` : ""}</div>
        <label class="f" for="note-${b.id}">${done ? "Note" : "Why it didn't happen"}</label>
        ${done ? "" : `<div class="chips">${REASONS.map((r) => `<button class="chip" data-act="reason" data-id="${b.id}" data-v="${esc(r)}" aria-pressed="${note === r}">${r}</button>`).join("")}</div>`}
        <textarea class="t" id="note-${b.id}" data-note="${b.id}" placeholder="${done ? "Anything worth remembering" : "Or write your own reason"}">${esc(note)}</textarea>
        <div class="row" style="margin:10px 0 0"><button class="btn ghost" data-act="open" data-id="${b.id}">Close</button><span class="saved" id="saved"></span></div>
      </div>` : "";
    return `<li class="blk${done ? " done" : ""}${isNow ? " now" : ""}" style="--cat:var(--c-${b.cat})">
      <div class="time" data-drag="${b.id}" title="Drag to move">${b.s}<span>${b.e}</span></div><div class="bar"></div>
      <button class="what" data-act="open" data-id="${b.id}" aria-expanded="${open}"><b>${esc(b.t)}</b>${subl ? `<span>${esc(subl)}</span>` : ""}${tags ? `<span class="meta">${tags}</span>` : ""}</button>
      <button class="tick" data-act="tick" data-id="${b.id}" aria-pressed="${done ? "true" : "false"}" aria-label="Mark ${esc(b.t)} done">${CHECK}</button>

  const counter = (key, label, val, target, per) => `<div class="counter"><div class="lab">${label}</div>

  return header(fmtDay(d), sub) + `<div class="today">

      </div>

      ${poopCard(d)}
      ${booksCard()}
      ${splitCard(d)}
      <p class="offline" id="offline" ${S.online ? "hidden" : ""}>Offline. Changes are kept on this device and sync when you're back.</p>
    </div>
    <div><ul class="list" id="blist">${items}</ul><p class="offline" style="margin-top:10px">Swipe an item right to tick it. Drag by the time to move it. Tap or hold for notes and times.</p>${choresSection(d)}</div>
  </div>`;
}

function viewLog() {
  const d = S.date, rec = day(d);
  const meal = (k, label, ph) => {
    const e = rec.est?.[k], txt = rec.meals?.[k], fresh = e && e.text === txt, busy = estimating.has(d + k);
    const line = !txt ? "" : busy ? `<div class="est">Estimating...</div>`
      : fresh ? `<div class="est" title="${esc((e.items || []).map((i) => i.name + " " + i.kcal).join(", "))}"><b>≈ ${e.kcal} kcal</b> P ${e.protein}g · F ${e.fat}g · C ${e.carbs}g</div>`
      : `<div class="est"><button class="chip" data-act="estimate" data-k="${k}">Estimate calories</button></div>`;
    const favs = S.goals.favs || [];
    const favRow = `<div class="favs">${favs.map((f, i) => S.favEdit ? `<button class="chip danger" data-act="favDel" data-i="${i}">✕ ${esc(f.name)}</button>` : `<button class="chip" data-act="fav" data-k="${k}" data-i="${i}" title="${esc(f.text)}">+ ${esc(f.name)}${f.est ? ` · ${f.est.kcal}` : ""}</button>`).join("")}
      ${fresh && !favs.some((f) => f.text === txt) ? `<button class="chip" data-act="saveFav" data-k="${k}">☆ Save as quick meal</button>` : ""}</div>`;
    return `<div class="field"><label class="f" for="m-${k}">${label}</label>
      <div class="mealrow"><input class="t" id="m-${k}" data-meal="${k}" value="${esc(txt)}" placeholder="${ph}" autocomplete="off" enterkeyhint="done">${SR ? `<button class="mic${S.listening === k ? " on" : ""}" data-act="voice" data-k="${k}" aria-label="Say what you had for ${label}">${MIC}</button>` : ""}</div>${line}${favRow}</div>`;
  };
  const T = targets(), F = dayFuel(rec);
  const mac = (label, v, t) => { const pct = t ? Math.min(100, (v / t) * 100) : 0; return `<div class="mac"><span>${label}</span><div class="meter${t && v > t * 1.05 ? " over" : ""}"><i style="width:${pct}%"></i></div><span>${v}${t ? ` / ${t}` : ""} g</span></div>`; };
  const fuel = `<div class="fuel">
      <div class="big-k">${F.kcal}<small>${T ? ` / ${T.kcal} kcal` : " kcal"}</small></div>
      <div class="muted" style="font-size:14px">${T ? (F.kcal <= T.kcal ? `${T.kcal - F.kcal} kcal left today` : `${F.kcal - T.kcal} kcal over today`) : `Set up your targets on the Body tab to see what's left.`}</div>
      ${mac("Protein", F.protein, T?.protein)}${mac("Fat", F.fat, T?.fat)}${mac("Carbs", F.carbs, T?.carbs)}
    </div>`;
  const scale = (field, label, words) => `<div class="field"><span class="f">${label}</span><div class="chips">${words.map((w, i) => `<button class="chip" data-act="scale" data-f="${field}" data-v="${i + 1}" aria-pressed="${rec[field] === i + 1}">${w}</button>`).join("")}</div></div>`;
  return header(fmtDay(d), `Daily log for ${fmtDate(d)}`) + `<div class="grid2">
    <section class="panel"><h2 style="font-size:22px;margin-bottom:14px">Food</h2>
      ${fuel}
      ${meal("breakfast", "First meal", "When you break the fast")}
      ${meal("lunch", "Second meal", "If you had one before dinner")}
      ${meal("dinner", "Dinner", "What you cooked")}
      ${meal("snacks", "Snacks", "Anything in between")}
      ${meal("drinks", "Drinks", "Water, coffee, beers")}
      ${(S.goals.favs || []).length ? `<button class="chip" data-act="favEdit" style="margin-bottom:10px">${S.favEdit ? "Done editing quick meals" : "Edit quick meals"}</button>` : ""}
      <p class="muted" style="font-size:13px">Calories are AI estimates from what you type or say. Add amounts ("200g chicken", "2 beers") for better numbers.</p>
    </section>
    <section class="panel"><h2 style="font-size:22px;margin-bottom:14px">How today went</h2>
      ${scale("mood", "Mood", ["Low", "Flat", "Okay", "Good", "Great"])}
      ${scale("energy", "Energy", ["Drained", "Low", "Steady", "Good", "Buzzing"])}
      <div class="field"><label class="f" for="wins">Wins</label><textarea class="t" id="wins" data-text="wins" placeholder="What did you finish or do well today?">${esc(rec.wins)}</textarea></div>
      <div class="field"><label class="f" for="note">How I'm really doing</label><textarea class="t" id="note" data-text="note" placeholder="Optional. The full version goes in your paper journal.">${esc(rec.note)}</textarea></div>
      <p class="saved" id="saved"></p>
    </section>
  </div>`;
}

// ---------- progress: review, streaks, heatmap, done list, gallery ----------
function dayStat(d) {
  const rec = S.days[d] || {}, bl = dayBlocks(d, rec, S.goals);
  const done = bl.filter((b) => rec.done?.[b.id]).length;
  return { total: bl.length, done, pct: bl.length ? done / bl.length : 0, rec, bl };
}
const heatColor = (p) => p <= 0 ? "var(--line)" : `color-mix(in srgb, var(--c-work) ${Math.round(25 + p * 75)}%, var(--surface))`;
function heatmap() {
  const t = today(); let d = weekDates(PLAN_START)[0]; const end = weekDates(PLAN_END)[6];
  let html = `<div class="heat"><span></span>${["M", "T", "W", "T", "F", "S", "S"].map((x) => `<span style="text-align:center">${x}</span>`).join("")}`;
  while (d <= end) {
    const wk = weekDates(d);
    html += `<span>${parseYmd(wk[0]).getDate()} ${parseYmd(wk[0]).toLocaleDateString("en-GB", { month: "short" })}</span>`;
    for (const x of wk) {
      if (x < PLAN_START || x > PLAN_END) { html += `<span></span>`; continue; }
      if (x > t) { html += `<button class="c fut" disabled aria-label="${fmtShort(x)}"></button>`; continue; }
      const st = dayStat(x);
      html += `<button class="c${x === S.date ? " sel" : ""}" style="background:${heatColor(st.pct)}" data-act="goDay" data-d="${x}" aria-label="${fmtShort(x)}: ${st.done} of ${st.total} done" title="${fmtShort(x)}: ${st.done} of ${st.total}">${x === t ? "<span>●</span>" : ""}</button>`;
    }
    d = addDays(d, 7);
  }
  return html + `</div>`;
}
function streak(key) {

async function shrink(file, max = 1400) {
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) throw new Error("not an image");
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
}

// ----- 30/70 split, from ticked work and job blocks -----
function splitWeek(d) {

  for (const dt of weekDates(d)) {
    if (dt < PLAN_START) continue;
    const rec = S.days[dt] || {}, bl = dayBlocks(dt, rec, S.goals);
    let any = false;
    for (const b of bl) {

      const m = Math.max(0, mins(b.e) - mins(b.s)), k = b.cat === "job" ? "job" : "own";

const sched = () => (Array.isArray(S.goals.schedule) && S.goals.schedule.length ? S.goals.schedule : BLOCKS);
const planOf = (id) => sched().find((b) => b.id === id);
// First edit of the weekly plan: copy the built-in plan, folding in any "every time" changes made earlier.
function ensureSched() {
  if (Array.isArray(S.goals.schedule) && S.goals.schedule.length) return S.goals.schedule;
  const gm = S.goals.times || {}, gn = S.goals.names || {};
  S.goals.schedule = BLOCKS.map((b) => {
    const c = JSON.parse(JSON.stringify(b));
    if (gm[b.id]) { const len = mins(b.e) - mins(b.s); c.s = gm[b.id]; c.e = fromMin(Math.min(mins(c.s) + len, 1439)); }
    if (gn[b.id]) c.t = gn[b.id];
    return c;
  });
  delete S.goals.times; delete S.goals.names;
  return S.goals.schedule;
}
function setName(id, name, scope = S.scope) {
  const rec = day(), plan = planOf(id); name = (name || "").trim().slice(0, 80);
  rec.names ||= {}; S.goals.names ||= {};
  if (scope === "all") {
    const b = ensureSched().find((x) => x.id === id); if (b && name) b.t = name;
    delete rec.names[id]; save("goals");
  } else {
    const base = S.goals.names[id] || plan?.t;
    if (!name || name === base) delete rec.names[id]; else rec.names[id] = name;
  }
  save("day", S.date);
}

  const w = e.target.closest(".blk .what"); if (!w || e.button > 0 || e.target.closest(".more")) return;
  sw = { w, li: w.closest(".blk"), id: w.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0, mode: null, pid: e.pointerId };
  sw.timer = setTimeout(() => { if (sw && !sw.mode) { sw.mode = "hold"; swallow(); if (navigator.vibrate) navigator.vibrate(15); S.open = sw.id; render(); sw = null; } }, 550);
});
document.addEventListener("pointermove", (e) => {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.mode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) { clearTimeout(sw.timer); sw.mode = Math.abs(dx) > Math.abs(dy) && dx > 0 ? "swipe" : "scroll"; if (sw.mode === "swipe") sw.li.classList.add("swiping"); }
  if (sw.mode === "swipe") { sw.dx = Math.max(0, Math.min(140, dx)); sw.w.style.transform = `translateX(${sw.dx}px)`; sw.w.classList.toggle("swipe-ok", sw.dx > 80); }
});
function endSwipe(e) {
  if (!sw || (e && e.pointerId !== sw.pid)) return;
  clearTimeout(sw.timer);
  const s0 = sw; sw = null;
  if (s0.mode === "swipe") { swallow(); s0.w.style.transform = ""; s0.li.classList.remove("swiping"); if (s0.dx > 80) toggleTick(s0.id); }
}
document.addEventListener("pointerup", endSwipe);
document.addEventListener("pointercancel", endSwipe);
document.addEventListener("click", (e) => { if (swallowClick) { swallowClick = false; if (e.target.closest(".blk")) { e.stopPropagation(); e.preventDefault(); } } }, true);
document.addEventListener("contextmenu", (e) => { if (e.target.closest(".blk .what")) e.preventDefault(); });

// ---------- drag to move ----------
function setMove(id, hhmm, scope = S.scope) {
  const rec = day(), plan = planOf(id);
  rec.moved ||= {}; S.goals.times ||= {};
  if (scope === "all") {
    const b = ensureSched().find((x) => x.id === id);
    if (b && hhmm) { const len = mins(b.e) - mins(b.s); b.s = hhmm; b.e = fromMin(Math.min(mins(hhmm) + len, 1439)); }
    delete rec.moved[id]; save("goals");
  } else {
    const base = S.goals.times[id] || plan?.s;
    if (!hhmm || hhmm === base) delete rec.moved[id]; else rec.moved[id] = hhmm;
  }
  save("day", S.date);
}
function toastAction(msg, label, fn) {
  const t = $("#toast"); t.innerHTML = `${esc(msg)} <button class="chip" style="margin-left:8px;padding:4px 10px">${esc(label)}</button>`;
  t.style.pointerEvents = "auto"; t.classList.add("on");
  t.querySelector("button").onclick = () => { fn(); t.classList.remove("on"); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove("on"); t.style.pointerEvents = ""; }, 6000);
}
let drag = null;
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest("[data-drag]"); if (!h || e.button > 0) return;
  const li = h.closest(".blk"), list = $("#blist"); if (!li || !list) return;
  e.preventDefault();
  drag = { id: h.dataset.drag, li, list, y0: e.clientY, started: false, pid: e.pointerId, target: null };
  try { h.setPointerCapture(e.pointerId); } catch {}
});
document.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dy = e.clientY - drag.y0;
  if (!drag.started) { if (Math.abs(dy) < 6) return; drag.started = true; drag.li.classList.add("dragging"); drag.list.classList.add("is-dragging"); if (navigator.vibrate) navigator.vibrate(10); }
  drag.li.style.transform = `translateY(${dy}px)`;
  const others = [...drag.list.querySelectorAll(".blk:not(.dragging)")];
  let before = others.find((o) => { const r = o.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; }) || null;
  const blocks = dayBlocks(S.date, day()).filter((b) => b.id !== drag.id);
  const idx = before ? others.indexOf(before) : others.length;
  const prev = blocks[idx - 1], next = blocks[idx], me = dayBlocks(S.date, day()).find((b) => b.id === drag.id);
  const len = mins(me.e) - mins(me.s);
  // Take the slot straight after the item above; at the top, finish just before the item below.
  let st = prev ? mins(prev.e) : next ? Math.max(0, mins(next.s) - len) : mins(me.s);
  st = Math.round(st / 5) * 5;
  drag.target = fromMin(st);
  let line = drag.list.querySelector(".dropline");
  if (!line) { line = document.createElement("li"); line.className = "dropline"; line.innerHTML = "<span></span>"; }
  line.querySelector("span").textContent = "Move to " + drag.target;
  drag.list.insertBefore(line, before);
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  d.list.querySelector(".dropline")?.remove();
  d.list.classList.remove("is-dragging"); d.li.classList.remove("dragging"); d.li.style.transform = "";
  if (d.started && d.target) {
    const t = d.target; setMove(d.id, t, "day"); render();
    toastAction("Moved to " + t + " today", "Make it every time", () => { setMove(d.id, t, "all"); render(); toast("Now " + t + " every time"); });
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
// a drag that started on the time shouldn't also open the item
document.addEventListener("click", (e) => { if (e.target.closest("[data-drag]")) e.stopPropagation(); }, true);

// ---------- desktop time picker: hour + minutes in 10-minute steps ----------
const TP_FINE = matchMedia("(pointer: fine)");
const TP_MINS = ["00", "10", "20", "30", "40", "50"];
function enhanceTimes() {
  if (!TP_FINE.matches) return;
  document.querySelectorAll('input[type="time"]:not([data-tp])').forEach((inp) => {
    inp.dataset.tp = "1"; inp.style.display = "none";
    const [hh = "", mm = ""] = (inp.value || "").split(":");
    const mins = mm && !TP_MINS.includes(mm) ? [...TP_MINS, mm].sort() : TP_MINS;
    const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
    const opts = (list, cur) => ["", ...list].map((v) => `<option value="${v}"${v === cur ? " selected" : ""}>${v || "--"}</option>`).join("");
    const label = esc(inp.getAttribute("aria-label") || (inp.id && document.querySelector(`label[for="${inp.id}"]`)?.textContent) || "Time");
    const w = document.createElement("span"); w.className = "tp";
    w.innerHTML = `<select class="t" aria-label="${label}, hour">${opts(hours, hh)}</select><b>:</b><select class="t" aria-label="${label}, minutes">${opts(mins, mm)}</select>`;
    inp.after(w);
    const [sh, sm] = w.querySelectorAll("select");
    w.addEventListener("change", (e) => {
      e.stopPropagation();
      let H = sh.value, M = sm.value;
      if (!H && !M) { if (inp.value) { inp.value = ""; inp.dispatchEvent(new Event("change", { bubbles: true })); } return; }
      if (!inp.value && (!H || !M)) return; // a new time waits until both hour and minutes are picked
      H ||= hh || "00"; M ||= "00";
      inp.value = H + ":" + M;
      inp.dispatchEvent(new Event("change", { bubbles: true }));
    });
  });
}
const renderPlain = render;
render = function () { const r = renderPlain.apply(this, arguments); enhanceTimes(); return r; };
enhanceTimes();

// ---------- push ----------
const b64 = (s) => { const p = "=".repeat((4 - (s.length % 4)) % 4); const raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); };
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Alerts weren't allowed"); return render(); }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await api("vapid");
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    await api("subscribe", { method: "POST", body: JSON.stringify(sub) });
    S.pushOn = true; toast("Alerts are on for this device"); render();
  } catch (err) { console.error(err); toast("Couldn't turn on alerts here"); }
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { try { await api("unsubscribe", { method: "POST", body: JSON.stringify({ endpoint: sub.endpoint }) }); } catch {} await sub.unsubscribe(); }
    S.pushOn = false; toast("Alerts are off for this device"); render();
  } catch (err) { console.error(err); toast("Couldn't turn alerts off here"); }
}
async function checkPush() {
  if (MODE === "artifact" || !pushSupported()) return;
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    const on = !!sub && Notification.permission === "granted";
    if (on !== S.pushOn) { S.pushOn = on; if (S.key) render(); }
  } catch {}
}
checkPush();

// ---------- boot ----------
let dbP;
function getDb() {
  if (!dbP && window.claude) dbP = window.claude.use("db");
  if (!dbP) return Promise.reject(new Error("no db yet"));
  return dbP.then((db) => { if (!db) { dbP = null; throw new Error("no db"); } return db; });
}
async function loadArtifact() {
  const db = await getDb();
  const [days, body, goals] = await Promise.all([db.collection("days").get(), db.doc("meta/body").get(), db.doc("meta/goals").get()]);
  const out = { days: {} };
  days.docs.forEach((d) => { out.days[d.id] = JSON.parse(JSON.stringify(d.data())); });
  if (body.exists) out.body = JSON.parse(JSON.stringify(body.data()));
  if (goals.exists) out.goals = JSON.parse(JSON.stringify(goals.data()));
  return out;
}
async function load() {
  const data = MODE === "artifact" ? await loadArtifact() : await api("all");
  S.days = data.days || {}; S.body = data.body || S.body; S.goals = data.goals || S.goals;
  S.goals.milestones ||= {}; S.body.entries ||= [];
  cache(); setOnline(true);
}
if (MODE !== "artifact" && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
render();
if (S.key && MODE === "artifact") {
  let tries = 0;
  const attempt = () => load().then(render).catch(() => { if (++tries < 12) setTimeout(attempt, 1000); else setOnline(false); });
  attempt();
} else if (S.key) load().then(render).catch((err) => { if (err.code === 401) { S.key = null; LS("plan.key", null); viewUnlock("Your key has changed. Enter the new one."); } else setOnline(false); });

// keep the dial and Now line fresh; roll over to the new day at midnight
let lastDay = today();
setInterval(() => {
  const t = today();
  if (t !== lastDay) { if (S.date === lastDay) S.date = t; lastDay = t; }
  if (S.view === "today" && !document.querySelector("input:focus,textarea:focus")) render();
}, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.key) load().then(render).catch(() => setOnline(false)); });
</script>
